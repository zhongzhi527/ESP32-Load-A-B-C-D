; ESP32 load-cell node with a local SSD1306 OLED and an ESP-NOW link to the
; handheld display. The same source builds both nodes; LOAD_CELL_UNIT selects
; the identity (1 = Load Cell A, 2 = Load Cell B).

[platformio]
default_envs = load_cell_a

[env:load_cell_a]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
build_flags =
    -D LOAD_CELL_UNIT=1
lib_deps =
    olikraus/U8g2@^2.35.30
    sparkfun/SparkFun Qwiic Scale NAU7802 Arduino Library@^1.0.6
monitor_speed = 115200

; Upload this environment to the second load-cell ESP32 (Load Cell B).
[env:load_cell_b]
extends = env:load_cell_a
build_flags =
    -D LOAD_CELL_UNIT=2
